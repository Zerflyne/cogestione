<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#160f14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Proposte, programma e iscrizioni della cogestione dell'IIS Evangelista Torricelli." />
    <title>Cogestione · Torricelli</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    />
    <script>
      // Applica il tema salvato prima del disegno, per evitare il lampo bianco.
      try {
        const t = localStorage.getItem('tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
