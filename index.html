<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Il sito dei rappresentanti degli studenti dell'IIS Evangelista Torricelli: chi siamo, cosa facciamo, cogestione e contatti." />
    <title>Studenti Torricelli · Rappresentanti d'istituto</title>
    <link rel="canonical" href="https://studentitorricelli.org/" />
    <!-- Anteprima dei link (WhatsApp, Telegram, Instagram, Facebook, X). Gli indirizzi devono essere assoluti.
         Immagine 1200x630 rigenerabile con: node docs/anteprima-social/genera.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studenti Torricelli" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://studentitorricelli.org/" />
    <meta property="og:title" content="Studenti Torricelli · Rappresentanti d&#39;istituto" />
    <meta property="og:description" content="Il sito dei rappresentanti degli studenti dell&#39;IIS Evangelista Torricelli: chi siamo, cosa facciamo, cogestione e contatti." />
    <meta property="og:image" content="https://studentitorricelli.org/anteprima.jpg" />
    <meta property="og:image:secure_url" content="https://studentitorricelli.org/anteprima.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Studenti Torricelli: la scuola la facciamo anche noi. Disegni di un atomo, una beuta e un compasso." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Studenti Torricelli · Rappresentanti d&#39;istituto" />
    <meta name="twitter:description" content="Il sito dei rappresentanti degli studenti dell&#39;IIS Evangelista Torricelli: chi siamo, cosa facciamo, cogestione e contatti." />
    <meta name="twitter:image" content="https://studentitorricelli.org/anteprima.jpg" />
    <script>
      // I vecchi indirizzi della cogestione (/#/proponi, ...) e i ritorni dall'accesso con Google
      // (?code=...) che arrivano qui vanno alla sezione cogestione, con tutto quello che portano.
      if (/^#\//.test(location.hash) || /[?&](code|error|error_description)=/.test(location.search)) {
        location.replace('./cogestione/' + location.search + location.hash);
      }
      // Applica il tema salvato prima del disegno, per evitare il lampo bianco.
      try {
        const t = localStorage.getItem('tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..600&family=Figtree:wght@400..600&family=DM+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="sito"></div>
    <script type="module" src="/src/sito/main.js"></script>
  </body>
</html>
