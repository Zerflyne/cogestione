<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<!-- Modello dell'immagine di anteprima dei link (WhatsApp, Telegram, Instagram...), 1200x630.
     Rigenerare con: node docs/anteprima-social/genera.mjs -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600&family=Figtree:wght@400;500&family=DM+Mono:wght@400&display=swap" />
<style>
  :root { --bg:#f6f6f3; --testo:#141413; --testo-2:#55554f; --testo-3:#8a8a83; --rosso:#9e0000; --accento:#7a1f5c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    background-image: radial-gradient(color-mix(in oklab, var(--testo) 12%, transparent) 1.3px, transparent 1.3px);
    background-size: 26px 26px;
    color: var(--testo); font-family: 'Figtree', sans-serif; position: relative; overflow: hidden;
  }
  .testi { position: absolute; left: 84px; top: 84px; width: 700px; }
  .logo { display: flex; align-items: center; gap: 16px; font: 600 30px 'Gabarito'; letter-spacing: -0.01em; }
  .sopra { margin-top: 64px; font: 400 21px 'DM Mono'; color: var(--testo-2); letter-spacing: 0.02em; text-transform: uppercase; }
  h1 { margin-top: 18px; font: 600 86px/0.98 'Gabarito'; letter-spacing: -0.045em; }
  .segnato { position: relative; display: inline-block; }
  .segnato svg { position: absolute; left: -2%; width: 104%; bottom: -16px; height: 26px; }
  .sotto { margin-top: 44px; font: 400 25px/1.35 'Figtree'; color: var(--testo-2); width: 620px; }
  .dominio { position: absolute; left: 84px; bottom: 58px; font: 400 22px 'DM Mono'; color: var(--testo); }
  .dominio b { color: var(--rosso); font-weight: 400; }
  svg.s path, svg.s circle { fill: none; stroke: var(--testo); stroke-linecap: round; stroke-linejoin: round; }
  svg.s .rosso, svg.s .rosso path { stroke: var(--rosso); }
  svg.s .pieno { fill: var(--rosso); stroke: none; }
  .d { position: absolute; }
  .formula { position: absolute; font: 500 30px 'Gabarito'; color: var(--testo-3); }
  .formula.r { color: var(--rosso); }
</style>
</head>
<body>
  <div class="testi">
    <div class="logo">
      <svg viewBox="0 0 64 64" width="52" height="52"><rect width="64" height="64" rx="14" fill="#7a1f5c"/><path d="M18 20h28M32 20v26" stroke="#fbf7f9" stroke-width="7" stroke-linecap="round" fill="none"/></svg>
      Studenti Torricelli
    </div>
    <p class="sopra" id="sopra"></p>
    <h1 id="titolo"></h1>
    <p class="sotto" id="sotto"></p>
  </div>
  <p class="dominio" id="dominio"></p>

  <!-- Atomo -->
  <svg class="s d" style="left:860px; top:60px; width:250px" viewBox="0 0 96 96">
    <g transform="rotate(0 48 48)"><path stroke-width="1.6" d="M8 48 C 8 29.3, 88 29.3, 88 48 C 88 66.7, 8 66.7, 8 48"/><circle class="pieno" r="3" cx="8" cy="48"/></g>
    <g transform="rotate(60 48 48)"><path stroke-width="1.6" d="M8 48 C 8 29.3, 88 29.3, 88 48 C 88 66.7, 8 66.7, 8 48"/><circle class="pieno" r="3" cx="88" cy="48"/></g>
    <g transform="rotate(-60 48 48)"><path stroke-width="1.6" d="M8 48 C 8 29.3, 88 29.3, 88 48 C 88 66.7, 8 66.7, 8 48"/><circle class="pieno" r="3" cx="60" cy="38"/></g>
    <path stroke-width="2.4" class="rosso" d="M48 42 C 43 42, 42 47, 43 50 C 45 55, 53 54, 54 49 C 55 44, 51 41, 46 43"/>
  </svg>
  <!-- Beuta -->
  <svg class="s d" style="left:930px; top:330px; width:200px" viewBox="0 0 96 96">
    <path stroke-width="1.9" d="M40 14 C 40 22, 41 30, 40 38 C 33 52, 25 66, 18 80 C 16 85, 18 87, 23 87 C 40 86, 57 87, 74 86 C 79 86, 80 84, 78 80 C 71 66, 63 52, 56 38 C 55 30, 56 22, 56 14"/>
    <path stroke-width="1.9" d="M35 14 C 44 13, 52 14, 61 13"/>
    <path stroke-width="2.2" class="rosso" d="M28 64 C 38 61, 48 67, 58 63 C 62 62, 66 63, 69 64"/>
    <path stroke-width="1.4" d="M44 26 L 50 26 M44 32 L 48 32"/>
    <circle class="rosso" cx="42" cy="74" r="2.6" stroke-width="1.4"/><circle class="rosso" cx="53" cy="56" r="2" stroke-width="1.4"/><circle class="rosso" cx="48" cy="44" r="2.6" stroke-width="1.4"/><circle class="rosso" cx="58" cy="76" r="1.8" stroke-width="1.4"/>
  </svg>
  <!-- Compasso -->
  <svg class="s d" style="left:790px; top:380px; width:120px; transform: rotate(-14deg)" viewBox="0 0 96 96">
    <path stroke-width="2.2" d="M48 9 C 43 9, 42 15, 45 18 C 48 21, 54 18, 53 13 C 52 10, 50 9, 47 10"/>
    <path stroke-width="2.2" d="M48 9 L 48 3"/>
    <path stroke-width="2.2" d="M45 19 C 39 40, 33 60, 27 80"/>
    <path stroke-width="2.2" d="M51 19 C 56 36, 60 50, 64 68 L 69 66 L 70 80 L 63 70"/>
    <path stroke-width="2.4" class="rosso" d="M18 86 C 32 93, 56 93, 76 82"/>
  </svg>
  <span class="formula r" style="left:1010px; top:290px">E = mc²</span>
  <span class="formula" style="left:800px; top:300px">∫ f(x) dx</span>
  <span class="formula" style="left:860px; top:545px">a² + b² = c²</span>
  <span class="formula r" style="left:1090px; top:40px; font-size:26px">H₂O</span>

<script>
  const p = new URLSearchParams(location.search);
  const t = {
    sito: {
      sopra: 'Rappresentanti d’istituto',
      titolo: 'La scuola la facciamo <span class="segnato">anche noi<svg viewBox="0 0 300 24" preserveAspectRatio="none" class="s"><path class="rosso" stroke-width="4" d="M4 15 C 60 9, 140 8, 210 10 S 280 12, 296 9"/><path class="rosso" stroke-width="2.6" d="M30 20 C 90 15, 170 15, 270 17"/></svg></span>.',
      sotto: 'Assemblee, Consiglio d’istituto, idee e cogestione dell’IIS Evangelista Torricelli.',
      dominio: 'studentitorricelli.org',
    },
    cogestione: {
      sopra: 'Cogestione · IIS Torricelli',
      titolo: 'La cogestione <span class="segnato">la fate voi<svg viewBox="0 0 300 24" preserveAspectRatio="none" class="s"><path class="rosso" stroke-width="4" d="M4 15 C 60 9, 140 8, 210 10 S 280 12, 296 9"/><path class="rosso" stroke-width="2.6" d="M30 20 C 90 15, 170 15, 270 17"/></svg></span>.',
      sotto: 'Cinque giorni di corsi proposti dagli studenti: proponi, guarda il programma, iscriviti.',
      dominio: 'studentitorricelli.org<b>/cogestione</b>',
    },
  }[p.get('pagina') || 'sito'];
  for (const k in t) document.getElementById(k).innerHTML = t[k];
</script>
</body>
</html>
