<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131012" media="(prefers-color-scheme: dark)" />

    <title>Cogestione · Torricelli</title>
    <link rel="canonical" href="https://studentitorricelli.org/cogestione/" />
    <!-- Anteprima dei link (WhatsApp, Telegram, Instagram, Facebook, X). Gli indirizzi devono essere assoluti.
         Immagine 1200x630 rigenerabile con: node docs/anteprima-social/genera.mjs -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studenti Torricelli" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://studentitorricelli.org/cogestione/" />
    <meta property="og:title" content="Cogestione · Torricelli" />
    <meta property="og:description" content="Proposte, programma e iscrizioni della cogestione dell&#39;IIS Evangelista Torricelli." />
    <meta property="og:image" content="https://studentitorricelli.org/cogestione/anteprima.jpg" />
    <meta property="og:image:secure_url" content="https://studentitorricelli.org/cogestione/anteprima.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cogestione del Torricelli: la cogestione la fate voi. Disegni di un atomo, una beuta e un compasso." />

    <meta name="twitter:title" content="Cogestione · Torricelli" />

    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..600&family=Figtree:wght@400..600&family=DM+Mono:wght@400;500&display=swap"
    />
    <script>
      // Applica il tema salvato prima del disegno, per evitare il lampo bianco.
      try {
        const t = localStorage.getItem('tema');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
